[defaults]
inventory = inventory
host_key_checking = false
remote_user = ansible
private_key_file = ~/.ssh/id_ecdsa_sk_poc

[ssh_connection]
# Keep ControlPersist short: while the connection stays open, any process running as you can reuse it without a touch.
ssh_args = -o ControlMaster=auto -o ControlPersist=30s -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes
pipelining = true
