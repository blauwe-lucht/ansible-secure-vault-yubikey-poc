---
- name: Use a vaulted secret on a remote host
  hosts: poc-target
  gather_facts: false
  tasks:
    # Not vars_files: a syntax check would then need to decrypt it.
    - name: Load vaulted secret
      ansible.builtin.include_vars: secret.yml

    - name: Echo secret message on the target
      ansible.builtin.command: echo "{{ secret_message }}"
      register: echo_result
      changed_when: false

    - name: Assert the decrypted secret made it to the target
      ansible.builtin.assert:
        that: echo_result.stdout == secret_message
        success_msg: "Target says: {{ echo_result.stdout }}"
